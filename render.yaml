services:
  - type: web
    name: hamilton-mostrador
    runtime: node
    plan: starter
    buildCommand: echo "sin dependencias"
    startCommand: node server.mjs
    healthCheckPath: /api/public
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
